<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="FileNest">
  <!-- 小尺寸（16/32/64）专用：去掉纸张、图形放大、圆角略小、对比更强 -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5BB0FF"/>
      <stop offset="0.55" stop-color="#187CF0"/>
      <stop offset="1" stop-color="#0050C0"/>
    </linearGradient>
    <linearGradient id="folder" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F0FF"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g transform="translate(512 512) scale(1.24) translate(-512 -512)">
      <path
        d="M250 306
           H 386
           A 40 40 0 0 1 417 318
           L 458 366
           H 774
           A 58 58 0 0 1 832 424
           V 712
           A 58 58 0 0 1 774 770
           H 250
           A 58 58 0 0 1 192 712
           V 364
           A 58 58 0 0 1 250 306
           Z"
        fill="url(#folder)"
      />
    </g>
  </g>
</svg>
